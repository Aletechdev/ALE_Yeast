# yAMP params file template: every launch-form field, in launch-form order, plus the
# hidden parameters a Tier-1 run needs. Recipe values come from conf/test/ottilie_common.config
# (the validated ALE recipe); everything else is at its pipeline default.
#
# GENERATED by bin/make_params_template.py. Do not edit here. Copy it, fill the `<-- SET`
# lines, delete what you leave at default, and launch with `-params-file <copy>.yml`
# (or upload it in the Seqera launch form). How to use it, precedence and the traps:
# docs/usage/launch_params_file.md
#
# `null` here is a real null (unset). On the command line `--x null` is the STRING 'null'.

# ===== Input/output options =====
input: null   # <-- SET  samplesheet CSV, absolute paths inside (docs/usage/input_samplesheet.md)
outdir: null  # <-- SET  a NEW directory per run; publishDir overwrites but never deletes

# ===== Reference genome options =====
fasta: null         # <-- SET  reference FASTA (docs/usage/prepare_reference.md)
snpeff_cache: null  # <-- SET  a DIRECTORY (local, az://, s3:// or gs://), not a .tar.gz
snpeff_db: null     # <-- SET  the <db> directory name inside snpeff_cache
report_gff3: null   # <-- SET  gene track for the mutation report; optional

# ===== Main options =====
qc_only: false                                       # Stop before alignment and write a MultiQC report of the reads: fastp (trimming and filtering) and FastQC before and after read preprocessing.
tools: "snpeff,cnvkit,tiddit,manta,haplotypecaller"  # (Tier-1 recipe) Comma-separated list of tools to run.

# ===== Read preprocessing =====
trim_adapter: true           # Step 1 · Adapter trimming: remove adapter read-through.
adapter_sequence: null       # Step 1 · Adapter sequence for read 1.
adapter_sequence_r2: null    # Step 1 · Adapter sequence for read 2.
trim_nextseq: 0              # Step 1 · Poly-G tails: any non-zero value forces trimming.
clip_r1: 0                   # Step 2 · Clip this many bases from the 5' end of read 1, whatever their quality.
clip_r2: 0                   # Step 2 · Clip this many bases from the 5' end of read 2, whatever their quality.
three_prime_clip_r1: 0       # Step 2 · Clip this many bases from the 3' end of read 1, whatever their quality.
three_prime_clip_r2: 0       # Step 2 · Clip this many bases from the 3' end of read 2, whatever their quality.
trim_quality_3prime: "tail"  # Step 3 · Quality trimming, 3' end.
trim_quality_5prime: null    # Step 3 · Quality trimming, 5' end.
trim_quality_mean: 20        # Step 3 · Mean Phred quality a window must reach, both ends.
trim_quality_window: 4       # Step 3 · Window size in bases, both ends.
filter_quality: true         # Step 4 · Read filter: discard read pairs with too many low-quality bases (thresholds below).
filter_quality_phred: 15     # Step 4 · A base counts as good at or above this Phred quality.
filter_quality_percent: 40   # Step 4 · Discard a read pair when more than this percentage of a read's bases are below that quality.
length_required: 15          # Step 4 · Discard reads shorter than this after trimming.
save_trimmed: null           # Outputs: publish the trimmed FASTQ files (preprocessing/fastp/<sample>/).

# ===== Alignment =====
aligner: "bwa-mem"        # Specify aligner to be used to map reads to reference genome.
save_mapped: null         # Also publish the aligned CRAM from before duplicate marking.
save_output_as_bam: null  # Publish the alignment files as BAM instead of CRAM.

# ===== Variant Calling =====
joint_germline: true          # (Tier-1 recipe) Turn on the joint germline variant calling for GATK haplotypecaller
joint_manta: true             # One multi-sample Manta germline run per experiment, every sample of the experiment genotyped at each candidate SV.
manta_high_sensitivity: null  # Run Manta with its human-WGS repeat heuristics off: depth filters disabled (--exome) and graphNodeMaxEdgeCount = 0.
generate_reports: true        # Generate the ALE mutation-report dashboard (igv-reports) after variant calling.

# ===== Hidden on the launch form, but part of every Tier-1 run =====
skip_tools: "baserecalibrator"         # REQUIRED on a custom genome: BaseRecalibrator needs known-sites VCFs; omitting this aborts the run
genome: null                           # no iGenomes genome; the FASTA above is the reference
igenomes_ignore: true                  # do not load the iGenomes config
split_haplotypecaller_joint_vcf: true  # per-sample VCFs from the joint HaplotypeCaller call (a Tier-1 deliverable)
split_fastq: 0                         # no FASTQ sharding; keeps the task graph identical between runs

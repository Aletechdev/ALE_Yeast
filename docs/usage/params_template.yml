# yAMP params file template — every launch-form field, in launch-form order, plus the
# hidden parameters a Tier-1 run needs. Recipe values come from conf/test/ottilie_common.config
# (the validated ALE recipe); everything else is at its pipeline default.
#
# GENERATED by bin/make_params_template.py — do not edit here. Copy it, fill the `<-- SET`
# lines, delete what you leave at default, and launch with `-params-file <copy>.yml`
# (or upload it in the Seqera launch form). How to use it, precedence and the traps:
# docs/usage/launch_params_file.md
#
# `null` here is a real null (unset). On the command line `--x null` is the STRING 'null'.

# ===== Input/output options =====
input: null   # <-- SET  samplesheet CSV — absolute paths inside (docs/usage/input_samplesheet.md)
outdir: null  # <-- SET  a NEW directory per run; publishDir overwrites but never deletes

# ===== Reference genome options =====
fasta: null         # <-- SET  reference FASTA (docs/usage/prepare_reference.md)
snpeff_cache: null  # <-- SET  a DIRECTORY (local, az://, s3:// or gs://), not a .tar.gz
snpeff_db: null     # <-- SET  the <db> directory name inside snpeff_cache
report_gff3: null   # <-- SET  gene track for the mutation report; optional

# ===== Main options =====
tools: "snpeff,cnvkit,tiddit,manta,haplotypecaller"  # (Tier-1 recipe) Comma-separated list of tools to run.

# ===== Variant Calling =====
joint_germline: true          # (Tier-1 recipe) Turn on the joint germline variant calling for GATK haplotypecaller
joint_manta: true             # One multi-sample Manta germline run per experiment, every sample of the experiment genotyped at each candidate SV.
manta_high_sensitivity: null  # Run Manta with its human-WGS repeat heuristics off: depth filters disabled (`--exome`) and graphNodeMaxEdgeCount = 0.
generate_reports: true        # Generate the ALE mutation-report dashboard (igv-reports) after variant calling.

# ===== Read preprocessing =====
trim_adapter: true           # Step 1 · Adapter trimming: run fastp to remove adapter read-through (and, by default, apply step 4's read filter).
adapter_sequence: null       # Step 1 · Adapter trimming: adapter sequence for read 1 (fastp `--adapter_sequence`).
adapter_sequence_r2: null    # Step 1 · Adapter trimming: adapter sequence for read 2 (fastp `--adapter_sequence_r2`).
trim_nextseq: 0              # Step 1 · Adapter trimming: force poly-G tail trimming (fastp `--trim_poly_g`); any non-zero value enables it.
clip_r1: 0                   # Step 2 · Fixed-count clipping: remove this many bp from the 5' end of read 1 regardless of quality (fastp `--trim_front1`).
clip_r2: 0                   # Step 2 · Fixed-count clipping: remove this many bp from the 5' end of read 2 regardless of quality (fastp `--trim_front2`).
three_prime_clip_r1: 0       # Step 2 · Fixed-count clipping: remove this many bp from the 3' end of read 1 regardless of quality (fastp `--trim_tail1`); applied before step 3's quality cut.
three_prime_clip_r2: 0       # Step 2 · Fixed-count clipping: remove this many bp from the 3' end of read 2 regardless of quality (fastp `--trim_tail2`).
trim_quality_3prime: "tail"  # Step 3 · Quality trimming, 3' end: trim a variable number of low-quality bases from the 3' end - `tail` (stop at the first good window, the ALE default) or `right` (cut at the first bad window and everything after it).
trim_quality_5prime: null    # Step 3 · Quality trimming, 5' end: trim a variable number of low-quality bases from the 5' end (fastp `--cut_front`, Trimmomatic `LEADING`).
trim_quality_mean: 20        # Step 3 · Quality trimming: mean Phred quality a window must reach to survive (fastp `--cut_mean_quality`), both ends.
trim_quality_window: 4       # Step 3 · Quality trimming: window size in bases (fastp `--cut_window_size`), both ends.
filter_quality: true         # Step 4 · Read filtering: discard read pairs with too many low-quality bases (fastp's read-level filter; thresholds below).
filter_quality_phred: 15     # Step 4 · Read filtering: a base counts as qualified at or above this Phred quality (fastp `--qualified_quality_phred`).
filter_quality_percent: 40   # Step 4 · Read filtering: discard a read pair when more than this percentage of a read's bases are unqualified (fastp `--unqualified_percent_limit`).
length_required: 15          # Step 4 · Read filtering: discard reads shorter than this after trimming (fastp `--length_required`).
save_trimmed: null           # Outputs: publish the trimmed FASTQ files (preprocessing/fastp/<sample>/).

# ===== Alignment =====
aligner: "bwa-mem"        # Specify aligner to be used to map reads to reference genome.
save_mapped: null         # Save mapped files.
save_output_as_bam: null  # Saves output from mapping (if `--save_mapped`), Markduplicates & Baserecalibration as BAM file instead of CRAM

# ===== Hidden on the launch form, but part of every Tier-1 run =====
skip_tools: "baserecalibrator"         # REQUIRED on a custom genome — BaseRecalibrator needs known-sites VCFs; omitting this aborts the run
genome: null                           # no iGenomes genome; the FASTA above is the reference
igenomes_ignore: true                  # do not load the iGenomes config
split_haplotypecaller_joint_vcf: true  # per-sample VCFs from the joint HaplotypeCaller call (a Tier-1 deliverable)
split_fastq: 0                         # no FASTQ sharding — keeps the task graph identical between runs

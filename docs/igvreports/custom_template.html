<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ALE Variant Inspector</title>

    <!-- Tabulator -->
    <link href="https://unpkg.com/tabulator-tables@6.3.0/dist/css/tabulator.min.css" rel="stylesheet">
    <script type="text/javascript" src="https://unpkg.com/tabulator-tables@6.3.0/dist/js/tabulator.min.js"></script>

    <!-- igv -->
    <script src="https://cdn.jsdelivr.net/npm/igv@3.5.2/dist/igv.min.js"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            font-size: 13px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* --- Header toolbar --- */
        #toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 16px;
            background: #f6f8fa;
            border-bottom: 1px solid #d0d7de;
            flex-shrink: 0;
        }
        #toolbar h1 {
            font-size: 1.1em;
            margin: 0;
            color: #24292f;
        }
        #clearFilters, #exportFilters, #importFilters, #exportCsv, #downloadVcf, #showLegend {
            padding: 4px 10px;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85em;
        }
        #clearFilters { background: #555555; }
        #clearFilters:hover { background: #333333; }
        #exportFilters { background: #d45500; }
        #exportFilters:hover { background: #b34700; }
        #importFilters { background: #d45500; }
        #importFilters:hover { background: #b34700; }
        #exportCsv { background: #0077bb; }
        #exportCsv:hover { background: #005fa3; }
        #downloadVcf { background: #7b2d8b; }
        #downloadVcf:hover { background: #5f2269; }
        #showLegend { background: #4a6785; }
        #showLegend:hover { background: #3a5575; }
        /* Legend modal */
        #legendOverlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.4);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        #legendOverlay.open { display: flex; }
        #legendModal {
            background: white;
            border-radius: 8px;
            box-shadow: 0 8px 30px rgba(0,0,0,.25);
            max-width: 720px;
            width: 90%;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
        }
        #legendModal .legend-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid #d0d7de;
        }
        #legendModal .legend-header h2 { margin: 0; font-size: 1em; }
        #legendModal .legend-close {
            background: none; border: none; font-size: 18px; cursor: pointer; color: #555; padding: 0 4px;
        }
        #legendModal .legend-body {
            overflow-y: auto;
            padding: 12px 16px;
        }
        #legendModal table { width: 100%; border-collapse: collapse; font-size: 12px; }
        #legendModal th { text-align: left; padding: 6px 8px; background: #f6f8fa; border-bottom: 2px solid #d0d7de; }
        #legendModal td { padding: 5px 8px; border-bottom: 1px solid #eee; vertical-align: top; }
        #legendModal td:first-child { font-weight: 600; white-space: nowrap; min-width: 140px; }
        #legendModal .legend-group { color: #555; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; padding: 10px 8px 4px; }
        /* Column chooser */
        #columnChooserWrap { position: relative; }
        #toggleColumns { padding: 4px 10px; color: white; background: #2e7d32; border: none; border-radius: 4px; cursor: pointer; font-size: 0.85em; }
        #toggleColumns:hover { background: #1b5e20; }
        #columnChooserMenu {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            margin-top: 4px;
            background: white;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            box-shadow: 0 4px 12px rgba(0,0,0,.15);
            max-height: 400px;
            overflow-y: auto;
            z-index: 1000;
            min-width: 200px;
            padding: 6px 0;
        }
        #columnChooserMenu label {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 3px 12px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 12px;
        }
        #columnChooserMenu label:hover { background: #f0f4f8; }
        /* --- Main content: table + IGV split --- */
        #content {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
        }

        /* Table panel — takes up top 70%, resizable via drag handle */
        #tablePanel {
            flex: 7;
            min-height: 200px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border-bottom: 3px solid #d0d7de;
        }

        #tableSelectorDiv {
            flex: 1;
            overflow: auto;
        }

        /* Override Tabulator's pagination to be sticky at bottom */
        .tabulator .tabulator-footer {
            position: sticky;
            bottom: 0;
            background: #f6f8fa;
            border-top: 1px solid #d0d7de;
            z-index: 10;
        }

        /* IGV panel — bottom ~15% */
        #igvPanel {
            flex: 1.5;
            min-height: 150px;
            overflow: auto;
        }

        #igvDiv {
            height: 100%;
        }

        /* Resize handle between panels */
        #resizeHandle {
            height: 6px;
            background: #d0d7de;
            cursor: row-resize;
            flex-shrink: 0;
        }
        #resizeHandle:hover {
            background: #0366d6;
        }
    </style>
</head>

<body>

<div id="app">
    <!-- Toolbar -->
    <div id="toolbar">
        <h1>ALE Variant Inspector</h1>
        <button id="clearFilters">Clear Filters</button>
        <button id="exportFilters">Export Filters</button>
        <button id="importFilters">Import Filters</button>
        <button id="exportCsv">Export CSV</button>
        <button id="downloadVcf">Download VCF</button>
        <div id="columnChooserWrap">
            <button id="toggleColumns">Columns</button>
            <div id="columnChooserMenu"></div>
        </div>
        <button id="showLegend">Legend</button>
        <input type="file" id="filterFileInput" accept=".json" style="display:none">
    </div>

    <!-- Legend modal -->
    <div id="legendOverlay">
        <div id="legendModal">
            <div class="legend-header">
                <h2>Column Legend</h2>
                <button class="legend-close" title="Close">&times;</button>
            </div>
            <div class="legend-body" id="legendBody"></div>
        </div>
    </div>

    <!-- Main content -->
    <div id="content">
        <!-- Variant table -->
        <div id="tablePanel">
            <div id="tableSelectorDiv"></div>
        </div>

        <!-- Per-sample navigation hint -->
        <div id="sample-hint" style="padding:4px 16px;background:#e8f4fd;border-top:1px solid #b3d9f2;border-bottom:1px solid #b3d9f2;font-size:11px;color:#1a5276;flex-shrink:0;display:flex;align-items:center;gap:8px">
            <span style="flex:1">Cohort-level report. Click any per-sample <strong>GT</strong> or <strong>VAF</strong> cell (non-reference genotypes only, i.e. GT&#8800;0) to open the per-sample IGV report at that locus. Per-sample reports include all non-reference variants from joint calling (soft-filtered, annotated by SnpEff).</span>
            <button onclick="this.parentElement.style.display='none'" style="background:none;border:none;cursor:pointer;font-size:14px;color:#1a5276;padding:0 2px;line-height:1" title="Dismiss">&times;</button>
        </div>

        <!-- Drag handle -->
        <div id="resizeHandle"></div>

        <!-- IGV browser -->
        <div id="igvPanel">
            <div id="igvDiv"></div>
        </div>
    </div>
</div>

<script type="text/javascript">

    const tableJson = "@TABLE_JSON@";
    const sessionDictionary = "@SESSION_DICTIONARY@";
    const filterConfig = "@FILTER_CONFIG@";

    // VCF download link (file-based) — injected by build script
    const vcfHref = "@VCF_HREF@";
    const vcfFilename = "@VCF_FILENAME@";

    let igvBrowser;
    let table;

    document.addEventListener("DOMContentLoaded", function () {
        initIGV();
        initResizeHandle();
    });

    function initIGV() {
        const igvDiv = document.getElementById("igvDiv");
        const options = {
            sessionURL: sessionDictionary["0"],
            showChromosomeWidget: false,
            showCenterGuide: true,
            search: false
        };

        igv.createBrowser(igvDiv, options)
            .then(function (b) {
                igvBrowser = b;
                initTable();
            });
    }

    // Column config: embedded since --filter-config requires --tabulator (built-in template)
    // Columns with formatter:"html" render <br> as line breaks (SnpEff ANN fields)

    // Custom formatter: strips empty <br> entries, shows "GENE: change" for context
    function annCondensedFormatter(cell) {
        const val = cell.getValue();
        if (!val) return "";
        const row = cell.getRow().getData();
        const genes = (row["GENE"] || "").split("<br>");
        const parts = val.split("<br>");
        // Pair each entry with its gene, keep only non-empty
        const items = [];
        for (let i = 0; i < parts.length; i++) {
            if (parts[i].trim()) {
                const gene = genes[i] ? genes[i].trim() : "";
                items.push(gene ? `<b>${gene}</b>: ${parts[i].trim()}` : parts[i].trim());
            }
        }
        return items.length ? items.join("<br>") : "";
    }

    const columnSettings = {
        "GENE":               { type: "string", filter: "contains", formatter: "html" },
        "EFFECTS":            { type: "string", filter: "list",     formatter: "html" },
        "IMPACT":             { type: "string", filter: "list",     formatter: "html" },
        "TRANSCRIPT":         { type: "string", filter: "contains", formatter: "html" },
        "GENE_ID":            { type: "string", filter: "contains", formatter: "html" },
        "PROTEIN ALTERATION": { type: "string", filter: "contains", formatter: annCondensedFormatter },
        "DNA ALTERATION":     { type: "string", filter: "contains", formatter: annCondensedFormatter },
        "VCF_FILTER":         { type: "string", filter: "list" },
        "ORIG_ALT":           { type: "string", filter: "contains" },
        "AF":                 { type: "number", filter: "range" },
        "DP":                 { type: "number", filter: "number" },
        "QD":                 { type: "number", filter: "range" },
        "MQ":                 { type: "number", filter: "number" },
    };

    // Columns hidden by default (toggle via Columns button)
    const hiddenByDefault = new Set(["ID", "TRANSCRIPT", "GENE_ID", "AC", "AF", "DP", "QD", "MQ"]);
    const hiddenSuffixes = [":GT"];  // hide per-sample GT columns
    function isHiddenByDefault(header) {
        if (hiddenByDefault.has(header)) return true;
        return hiddenSuffixes.some(s => header.endsWith(s));
    }

    const frozenCount = 4; // freeze first N visible columns (CHROM, POSITION, REF, ALT)

    function initTable() {
        let visibleIdx = 0;
        const columnConfig = tableJson.headers
            .filter(header => header !== "unique_id")
            .map(header => {
                const settings = columnSettings[header] || {};
                const isNumber = settings.type === "number";
                const vis = !isHiddenByDefault(header);
                const frozen = vis && visibleIdx < frozenCount;
                if (vis) visibleIdx++;
                return {
                    title: header,
                    field: header,
                    sorter: isNumber ? "number" : "string",
                    headerFilter: isNumber ? "number" : "input",
                    headerFilterPlaceholder: `Filter ${header}`,
                    formatter: settings.formatter || undefined,
                    visible: vis,
                    frozen: frozen,
                };
            });

        table = new Tabulator("#tableSelectorDiv", {
            data: tableJson.rows.map(row => {
                const obj = {};
                tableJson.headers.forEach((header, i) => {
                    obj[header] = row[i];
                });
                return obj;
            }),
            columns: columnConfig,
            layout: "fitDataTable",
            pagination: true,
            paginationSize: 25,
            paginationSizeSelector: [10, 25, 50, 100],
            paginationCounter: "rows",
            selectableRows: 1,
        });

        // Default: show only PASS variants (user can clear to see all)
        table.on("tableBuilt", function() {
            table.setHeaderFilterValue("VCF_FILTER", "PASS");
            buildColumnChooser();
        });

        // Clear filters
        document.getElementById("clearFilters").addEventListener("click", function() {
            table.clearFilter(true);
        });

        // Export filter configuration as JSON
        document.getElementById("exportFilters").addEventListener("click", function() {
            const filters = table.getHeaderFilters();
            if (!filters.length) {
                alert("No filters are currently active.");
                return;
            }
            const json = JSON.stringify(filters, null, 2);
            const blob = new Blob([json], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "variant_filters.json";
            a.click();
            URL.revokeObjectURL(url);
        });

        // Import filter configuration from JSON
        document.getElementById("importFilters").addEventListener("click", function() {
            document.getElementById("filterFileInput").click();
        });
        document.getElementById("filterFileInput").addEventListener("change", function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                try {
                    const filters = JSON.parse(ev.target.result);
                    // Clear existing filters first
                    table.clearFilter(true);
                    // Apply each saved filter
                    filters.forEach(f => {
                        table.setHeaderFilterValue(f.field, f.value);
                    });
                } catch (err) {
                    alert("Invalid filter file: " + err.message);
                }
            };
            reader.readAsText(file);
            // Reset input so the same file can be re-imported
            e.target.value = "";
        });

        // Export CSV (respects active filters — only exports visible rows)
        document.getElementById("exportCsv").addEventListener("click", function() {
            table.download("csv", "variants_export.csv", {}, "active");
        });

        // Download VCF file (links to vcf/ folder)
        document.getElementById("downloadVcf").addEventListener("click", function() {
            if (!vcfHref || vcfHref === "@" + "VCF_HREF@") {
                alert("VCF download not available for this report.");
                return;
            }
            const a = document.createElement("a");
            a.href = vcfHref;
            a.download = vcfFilename || "variants.vcf.gz";
            a.click();
        });

        // Cell click → link to per-sample report (sample columns only)
        table.on("cellClick", function(e, cell) {
            const field = cell.getField();
            // Column format: "ALE_Exp1_A0-F0-I1-R1:GT" (separator is colon)
            const match = field.match(/^(.+):(GT|AD|DP|GQ|VAF)$/);
            if (!match) return; // Not a sample column — fall through to rowClick

            // Check if sample has a variant at this position
            const samplePrefix = match[1];
            const gt = cell.getRow().getData()[samplePrefix + ":GT"];
            if (!gt || gt === "0/0" || gt === "./." || gt === "0|0" || gt === ".|.") return;

            // Build link to per-sample report
            e.stopPropagation(); // Prevent rowClick from firing
            const data = cell.getRow().getData();
            const locus = data["CHROM"] + ":" + data["POSITION"];
            // Strip patient prefix (e.g., "ALE_Exp1_A0-F0-I1-R1" → "A0-F0-I1-R1")
            const parts = samplePrefix.split("_");
            const sampleName = parts.length > 2 ? parts.slice(2).join("_") : parts[parts.length - 1];
            window.open("samples/" + sampleName + "_report.html?locus=" + locus, "_blank");
        });

        // Row click → load IGV session
        table.on("rowClick", function(e, row) {
            const uniqueId = row.getData()["unique_id"];
            const session = sessionDictionary[uniqueId];
            if (session) {
                igvBrowser.loadSession({ url: session });
            }
        });
    }

    // --- Column chooser ---
    function buildColumnChooser() {
        const menu = document.getElementById("columnChooserMenu");
        menu.innerHTML = "";
        table.getColumns().forEach(function(col) {
            const field = col.getField();
            if (!field || field === "unique_id") return;
            const label = document.createElement("label");
            const cb = document.createElement("input");
            cb.type = "checkbox";
            cb.checked = col.isVisible();
            cb.addEventListener("change", function() {
                if (cb.checked) col.show(); else col.hide();
            });
            label.appendChild(cb);
            label.appendChild(document.createTextNode(col.getDefinition().title || field));
            menu.appendChild(label);
        });
    }

    document.getElementById("toggleColumns").addEventListener("click", function(e) {
        e.stopPropagation();
        const menu = document.getElementById("columnChooserMenu");
        const visible = menu.style.display === "block";
        menu.style.display = visible ? "none" : "block";
        if (!visible) buildColumnChooser(); // refresh state
    });

    document.addEventListener("click", function(e) {
        const menu = document.getElementById("columnChooserMenu");
        if (!document.getElementById("columnChooserWrap").contains(e.target)) {
            menu.style.display = "none";
        }
    });

    // --- Legend modal ---
    const columnDescriptions = {
        // VCF core fields
        "CHROM":              ["VCF", "Chromosome or contig name"],
        "POSITION":           ["VCF", "1-based genomic position of the variant"],
        "REF":                ["VCF", "Reference allele at this position"],
        "ALT":                ["VCF", "Alternate allele (after multi-allelic splitting)"],
        "ID":                 ["VCF", "Variant identifier (typically '.' for novel variants)"],
        "VCF_FILTER":         ["VCF", "Soft-filter status from GATK VariantFiltration (PASS = high confidence; other values indicate which quality filter was triggered)"],
        "ORIG_ALT":           ["VCF", "Original ALT allele(s) before bcftools norm -m- splitting (shows the multi-allelic representation)"],
        // VCF INFO / quality
        "AC":                 ["Quality", "Allele count — number of ALT alleles across all samples"],
        "AF":                 ["Quality", "Allele frequency — fraction of ALT alleles across all samples in the cohort"],
        "DP":                 ["Quality", "Total read depth at this position (summed across all samples)"],
        "QD":                 ["Quality", "Quality by Depth — QUAL score normalized by unfiltered depth; low QD (<2) flags low-confidence calls"],
        "MQ":                 ["Quality", "Root mean square mapping quality of reads at this site; low MQ (<40) indicates ambiguous alignments"],
        // SnpEff annotation
        "GENE":               ["SnpEff", "Gene symbol affected by this variant"],
        "GENE_ID":            ["SnpEff", "Systematic gene identifier (e.g., SGD ID for yeast)"],
        "EFFECTS":            ["SnpEff", "Predicted variant effect (e.g., missense_variant, synonymous_variant, frameshift_variant)"],
        "IMPACT":             ["SnpEff", "Predicted impact severity: HIGH (loss of function), MODERATE (non-disruptive change), LOW (mostly harmless), MODIFIER (non-coding region)"],
        "TRANSCRIPT":         ["SnpEff", "Transcript ID used for effect prediction"],
        "PROTEIN ALTERATION": ["SnpEff", "Amino acid change in HGVS notation (e.g., p.Ala123Thr)"],
        "DNA ALTERATION":     ["SnpEff", "Nucleotide change in HGVS notation (e.g., c.367G>A)"],
    };

    // Per-sample column patterns (cohort report)
    const sampleFieldDescriptions = {
        "GT":  "Genotype (0/0 = ref homozygous, 0/1 = heterozygous, 1/1 = alt homozygous)",
        "AD":  "Allelic depths — read counts for ref and alt alleles (e.g., 45,23)",
        "DP":  "Sample-level read depth at this position",
        "GQ":  "Genotype quality — Phred-scaled confidence that the genotype is correct (higher = more confident)",
        "VAF": "Variant allele frequency — fraction of reads supporting the alt allele (computed by bcftools +fill-tags)",
    };

    function buildLegendContent() {
        const body = document.getElementById("legendBody");
        if (!table) { body.innerHTML = "<p>Table not loaded yet.</p>"; return; }

        const headers = table.getColumns().map(c => c.getField()).filter(f => f && f !== "unique_id");
        let html = '<table>';

        // Group: known columns
        const groups = {};
        const perSample = [];
        headers.forEach(h => {
            if (columnDescriptions[h]) {
                const [group, desc] = columnDescriptions[h];
                if (!groups[group]) groups[group] = [];
                groups[group].push([h, desc]);
            } else {
                const match = h.match(/^(.+):(GT|AD|DP|GQ|VAF)$/);
                if (match) {
                    perSample.push([h, match[1], match[2]]);
                }
            }
        });

        for (const [group, entries] of Object.entries(groups)) {
            html += `<tr><td colspan="2" class="legend-group">${group}</td></tr>`;
            for (const [col, desc] of entries) {
                html += `<tr><td>${col}</td><td>${desc}</td></tr>`;
            }
        }

        // Per-sample columns
        if (perSample.length > 0) {
            html += '<tr><td colspan="2" class="legend-group">Per-sample fields</td></tr>';
            // Show one description per field type, not per sample
            const shown = new Set();
            for (const [col, sample, field] of perSample) {
                if (!shown.has(field)) {
                    shown.add(field);
                    const desc = sampleFieldDescriptions[field] || "";
                    html += `<tr><td>{sample}:${field}</td><td>${desc}</td></tr>`;
                }
            }
            html += `<tr><td colspan="2" style="font-size:11px;color:#666;padding-top:8px">Click any non-reference GT or VAF cell to open the per-sample IGV report at that locus.</td></tr>`;
        }

        html += '</table>';
        body.innerHTML = html;
    }

    document.getElementById("showLegend").addEventListener("click", function() {
        buildLegendContent();
        document.getElementById("legendOverlay").classList.add("open");
    });
    document.querySelector("#legendModal .legend-close").addEventListener("click", function() {
        document.getElementById("legendOverlay").classList.remove("open");
    });
    document.getElementById("legendOverlay").addEventListener("click", function(e) {
        if (e.target === this) this.classList.remove("open");
    });

    // --- Resizable split panes ---
    function initResizeHandle() {
        const handle = document.getElementById("resizeHandle");
        const tablePanel = document.getElementById("tablePanel");
        const igvPanel = document.getElementById("igvPanel");
        const content = document.getElementById("content");
        let startY, startTableH, startIgvH;

        handle.addEventListener("mousedown", function(e) {
            e.preventDefault();
            startY = e.clientY;
            startTableH = tablePanel.offsetHeight;
            startIgvH = igvPanel.offsetHeight;
            document.addEventListener("mousemove", onDrag);
            document.addEventListener("mouseup", onRelease);
            document.body.style.cursor = "row-resize";
            document.body.style.userSelect = "none";
        });

        function onDrag(e) {
            const dy = e.clientY - startY;
            const newTableH = Math.max(150, startTableH + dy);
            const newIgvH = Math.max(150, startIgvH - dy);
            tablePanel.style.flex = "none";
            igvPanel.style.flex = "none";
            tablePanel.style.height = newTableH + "px";
            igvPanel.style.height = newIgvH + "px";
        }

        function onRelease() {
            document.removeEventListener("mousemove", onDrag);
            document.removeEventListener("mouseup", onRelease);
            document.body.style.cursor = "";
            document.body.style.userSelect = "";
        }
    }

</script>
</body>
</html>

# Tabulator filter configuration for igv-reports cohort report
# Only INFO columns need explicit config; sample FORMAT columns get default text filters
# Reference: https://github.com/igvteam/igv-reports/blob/master/test/data/variants/filter_config.yaml

columns:
  GENE:
    type: string
    filter: contains         # substring search box
  EFFECTS:
    type: string
    filter: list             # dropdown with all unique values
  IMPACT:
    type: string
    filter: list             # dropdown: HIGH, MODERATE, LOW, MODIFIER
  VCF_FILTER:
    type: string
    filter: list             # dropdown: PASS, QD_filter, MQ_filter, etc.
  ORIG_ALT:
    type: string
    filter: contains         # substring search for original multi-allelic context
  AF:
    type: number
    filter: range            # min/max numeric slider
  DP:
    type: number
    filter: threshold        # numeric cutoff (e.g., DP >= 10)
    threshold: 10
  QD:
    type: number
    filter: range            # min/max numeric range
  MQ:
    type: number
    filter: threshold        # numeric cutoff (e.g., MQ >= 40)
    threshold: 40

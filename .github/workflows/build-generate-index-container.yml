name: build-generate-index-container

# Builds containers/generate_index/Dockerfile (pandas + jinja2 for the
# GENERATE_INDEX process) and pushes it to BOTH registries:
#   - Docker Hub (canonical, public):  docker.io/${DOCKERHUB_NS}/ale-reports
#   - ghcr.io (backup/mirror):         ghcr.io/<owner>/ale-reports
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME  e.g. aledbucsd
#   DOCKERHUB_TOKEN     a Docker Hub access token (Read & Write)
# ghcr uses the built-in GITHUB_TOKEN (no secret needed).
#
# One-time: make the Docker Hub repo Public (repo -> Settings -> Make public).
# The pipeline pins the Docker Hub image (modules/local/generate_index/main.nf);
# ghcr is the private fallback — switch the pin there if Docker Hub is unavailable.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'containers/generate_index/**'
      - '.github/workflows/build-generate-index-container.yml'
    tags:
      - 'v*'

env:
  DOCKERHUB_NS: aledbucsd

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags (both registries)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            docker.io/${{ env.DOCKERHUB_NS }}/ale-reports
            ghcr.io/${{ github.repository_owner }}/ale-reports
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=ref,event=branch

      - name: Build and push to both registries
        uses: docker/build-push-action@v6
        with:
          context: ./containers/generate_index
          file: ./containers/generate_index/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Summary
        run: |
          echo "Pushed to Docker Hub (canonical) + ghcr (mirror):" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Module pins docker.io/${{ env.DOCKERHUB_NS }}/ale-reports (see modules/local/generate_index/main.nf)." >> "$GITHUB_STEP_SUMMARY"

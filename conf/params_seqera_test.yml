# =============================================================================
# Seqera Platform launch parameters — ALE Sarek 3.5.1 fork on Azure
# =============================================================================
# Yeast ALE (CEN.PK) — custom reference, all ALE tools enabled
# Upload this file in the Seqera launch form "Pipeline parameters" field
# or paste as YAML in the parameters editor.
#
# Blob container: aletest (storage account: aledata)
# =============================================================================

# --- Input / Output ---
input: "az://aletest/assets/reads/samplesheet_azure.csv"
outdir: "az://aletest/output_seqera_test"
step: "mapping"                     # Start from raw FASTQs
publish_dir_mode: "copy"

# --- Reference Genome (custom yeast, no iGenomes) ---
genome: null                        # Do not use iGenomes
igenomes_ignore: true               # Suppress iGenomes download
fasta: "az://aletest/assets/references/draft_ref52.fasta"
genbank: "az://aletest/assets/references/draft_ref52.gff3"
chr_dir: "az://aletest/assets/references/chromosomes"
save_reference: false

# --- Main Options ---
split_fastq: 0                      # No splitting — keeps lane integrity
no_intervals: true                  # Yeast genome is small; interval splitting adds overhead
wes: false                          # Whole genome, not exome
nucleotides_per_second: 200000

# --- Tools ---
tools: "snpeff,haplotypecaller,freebayes,cnvkit,tiddit,manta,breseq"
skip_tools: "baserecalibrator"      # No known-sites VCF for custom yeast genome

# --- Alignment ---
aligner: "bwa-mem"
save_mapped: false
save_output_as_bam: false           # Use CRAM (smaller)

# --- Sequencing Platform ---
seq_platform: "ILLUMINA"

# --- HaplotypeCaller Joint Germline ---
joint_germline: true
split_haplotypecaller_joint_vcf: true
hard_filter_haplotypecaller_joint: true

# --- Variant Calling ---
joint_mutect2: false
only_paired_variant_calling: false

# --- FASTQ Preprocessing (no trimming) ---
trim_fastq: false
clip_r1: 0
clip_r2: 0
three_prime_clip_r1: 0
three_prime_clip_r2: 0
trim_nextseq: 0
length_required: 15

# --- FreeBayes Thresholds ---
freebayes_qual_threshold: 20
freebayes_af_threshold: 0.05

# --- Control-FREEC ---
cf_coeff: 0.05
cf_contamination: 0
cf_mincov: 0
cf_window: 0                        # 0 = auto-compute from genome size

# --- ASCAT (not used for yeast, placeholders for schema) ---
ascat_min_base_qual: 20
ascat_min_counts: 10
ascat_min_map_qual: 35
ascat_purity: 1.0

# --- Annotation (SnpEff with custom yeast cache) ---
snpeff_cache: "az://aletest/assets/references/snpeff_cache"
snpeff_db: "draft_ref.52"

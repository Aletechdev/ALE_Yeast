# ALE launch-surface policy for nextflow_schema.json — applied by bin/apply_schema_overlay.py.
#
# The schema JSON is GENERATED from the upstream sarek schema plus this overlay: edit THIS file
# (or take a new upstream schema wholesale on a sarek upgrade), then run
#
#     python bin/apply_schema_overlay.py            # rewrite nextflow_schema.json in place
#     python bin/apply_schema_overlay.py --check    # verify the committed schema matches (CI/pre-commit)
#
# Never hand-edit "hidden" flags or the overridden texts in nextflow_schema.json directly.
#
# Policy: `visible` is an ALLOWLIST — every parameter in the schema that is not listed here is
# marked "hidden": true (collapsed behind Seqera's "Show hidden params" toggle and moved from
# --help to --help_full; still fully settable and validated). New parameters arriving with a
# sarek upgrade are therefore born hidden. A listed parameter missing from the schema (renamed
# or removed upstream) produces a warning, not a failure — update this list when that happens.
#
# Rationale per section (user review, 2026-09-01): Tier-1 ALE runs are germline-only
# (all samples status=0), tools = snpeff,cnvkit,tiddit,manta,haplotypecaller. Everything
# somatic/tumor-only, Sentieon, VEP/dbNSFP/SpliceAI, ASCAT, Control-FREEC, Mutect2, iGenomes,
# and human known-sites resources is hidden. FASTQ-preprocessing stays visible pending the
# trimming rework (docs/dev-practices/fastq_preprocessing_audit.md).

visible:
  # Input/output
  - input
  - outdir
  # Main options
  - tools
  # QC-first run (docs/usage/qc_first_run.md)
  - qc_only
  # Read preprocessing (docs/usage/read_preprocessing.md) - visible = the four fastp steps and
  # the trimmed-FASTQ publish flag. Hidden: step 0 UMI consensus (no ALE library has UMIs), the deprecated trim_fastq alias,
  # save_split_fastqs.
  - trim_adapter
  - adapter_sequence
  - adapter_sequence_r2
  - trim_nextseq
  - trim_quality_3prime
  - trim_quality_5prime
  - trim_quality_mean
  - clip_r1
  - clip_r2
  - three_prime_clip_r1
  - three_prime_clip_r2
  - trim_quality_window
  - filter_quality
  - filter_quality_phred
  - filter_quality_percent
  - length_required
  - save_trimmed
  # Preprocessing
  - aligner
  - save_mapped
  - save_output_as_bam
  # Variant calling (the ALE switches)
  - joint_germline
  - joint_manta
  - manta_high_sensitivity
  # split_haplotypecaller_joint_vcf hidden (2026-09-02): Tier-1 is designed around joint HC +
  # per-sample split always on (every ALE config pins it true); a visible toggle only invites
  # breaking the per-sample from-joint deliverables.
  - generate_reports
  # Reference genome (custom-genome launch surface)
  - fasta
  - snpeff_cache
  - snpeff_db
  - report_gff3

# Launch-form section order (2026-09-10, user review): every dataset-shaped field first (input,
# output, reference, cache), then the recipe (`tools`) and its switches (Variant calling), then the
# read-level groups (Read preprocessing, Alignment) that most launches leave at their defaults.
# Groups not listed keep their original relative order after the listed ones (new upstream
# groups land last).
group_order:
  - input_output_options
  - reference_genome_options
  - main_options
  - qc_first_run
  - variant_calling
  - fastq_preprocessing
  - preprocessing
  - annotation
  - general_reference_genome_options
  - institutional_config_options
  - generic_options

# Group title/description the fork owns (merged into the group entry).
group_overrides:
  # The two groups whose fields have a Browse button. Platform's file browser inserts Azure paths in
  # its own `az://<account>.<container>/` notation, which Nextflow reads as a container name and
  # Azure rejects (run 5syUy3CSjd3kyO, 2026-10-01: `Status code 400, InvalidResourceName` before any
  # task; nextflow-io/nextflow#4683, open since 2024). Same sentence in both, and on `input` below.
  input_output_options:
    description: "Where the run reads its samplesheet and writes its results. ⚠️ Azure: the Browse button inserts `az://<account>.<container>/…`. Delete `<account>.` or the run fails at start-up."
  reference_genome_options:
    description: "Reference genome files of the run. ⚠️ Azure: the Browse button inserts `az://<account>.<container>/…`. Delete `<account>.` or the run fails at start-up."
  # Upstream calls this group "Preprocessing" — next to "Read preprocessing" that reads as a
  # duplicate. Its visible fields are all alignment-output choices (2026-09-09).
  preprocessing:
    title: "Alignment"
    description: "bwa-mem alignment of the (preprocessed) reads and duplicate marking, and what to publish of it: save_mapped keeps the aligned CRAM before duplicate marking; save_output_as_bam publishes BAM instead of CRAM. Base quality recalibration is always skipped on custom genomes (no known-sites VCFs; skip_tools = baserecalibrator in every ALE profile)."
  fastq_preprocessing:
    title: "Read preprocessing"
    description: "Optional steps between the samplesheet and alignment, in run order: step 0 UMI consensus (fgbio, only with umi_read_structure) → fastp: step 1 adapter trimming · step 2 fixed-count clipping · step 3 quality trimming per read end · step 4 read filtering. ALE default: step 1 adapter trimming + step 3 tail quality trimming (+ step 4 read filter). For reads exactly as sequenced set trim_adapter = false and trim_quality_3prime unset; fastp then runs only if step 2 is set or split_fastq > 0. Details: docs/usage/read_preprocessing.md\n\n![One read through the preprocessing steps in run order; ALE default path in colour, optional steps in grey](https://raw.githubusercontent.com/Aletechdev/ALE_Yeast/main/docs/dev-practices/figures/fastq_trimming/read_preprocessing_steps.svg)"

# Parameter order inside a group (listed first, in this order; the rest follow in upstream order).
property_order:
  fastq_preprocessing:
    # step 0 - UMI consensus (hidden)
    - umi_read_structure
    - group_by_umi_strategy
    # step 1 - adapter trimming
    - trim_adapter
    - trim_fastq
    - adapter_sequence
    - adapter_sequence_r2
    - trim_nextseq
    # step 2 - fixed-count clipping
    - clip_r1
    - clip_r2
    - three_prime_clip_r1
    - three_prime_clip_r2
    # step 3 - quality trimming per read end
    - trim_quality_3prime
    - trim_quality_5prime
    - trim_quality_mean
    - trim_quality_window
    # step 4 - read filtering
    - filter_quality
    - filter_quality_phred
    - filter_quality_percent
    - length_required
    # outputs
    - save_trimmed
    - save_split_fastqs

# Merged key-by-key into the named parameter's schema entry (any group). Use for texts the
# fork owns outright; unlisted parameters keep their upstream description/help_text.
#
# Azure path rule (2026-10-04): the five visible path fields carry one extra subschema under `allOf`
# whose pattern, `^(?!az://[^/]*\.)`, fails a value whose container part holds a dot
# (`az://<account>.<container>/...`, what Platform's Browse button inserts; azure_batch_execution.md
# §19). A dot is not legal in an Azure container name, so no valid path is rejected; s3:// and gs://
# bucket names may hold dots and are not touched.
# Why `allOf` and not the field's own `pattern`: the form's file browser greys out "Select" for every
# file that fails the field's `pattern`, and it tests its own `az://<account>.<container>/` form, so
# a rule inside `pattern` made every Azure file unselectable (seen on the preview branch,
# 2026-10-04). The fields keep upstream's `pattern` untouched. The `errorMessage` sits inside the
# subschema, so nf-schema appends it to this rule's error only.
property_overrides:
  # Upstream text plus the Azure file-browser note (see group_overrides).
  input:
    description: "Path to comma-separated file containing information about the samples in the experiment. On Azure: `az://<container>/…`, without the account name."
    help_text: "A design file with information about the samples in your experiment. Use this parameter to specify the location of the input files. It has to be a comma-separated file with a header row. See [usage docs](https://nf-co.re/sarek/usage#input).\n\nIf no input file is specified, sarek will attempt to locate one in the `{outdir}` directory. If no input should be supplied, i.e. when --step is supplied or --build_only_index, then set --input false\n\nAzure: a path picked with Seqera Platform's file browser reads `az://<account>.<container>/…`. Nextflow takes `<account>.<container>` as the container name and the run stops at start-up with `Status code 400, InvalidResourceName` ([nextflow#4683](https://github.com/nextflow-io/nextflow/issues/4683)). Remove `<account>.`; this applies to every path field."
    allOf: &az_path_rule
      - pattern: "^(?!az://[^/]*\\.)"
        errorMessage: "Azure paths read az://<container>/..., without the storage account name: remove '<account>.' from a path picked with the Browse button."
  # Same rule on the other visible path fields (see the comment above property_overrides).
  outdir:
    allOf: *az_path_rule
  fasta:
    allOf: *az_path_rule
  snpeff_cache:
    allOf: *az_path_rule
  # Extension check (2026-10-04): the gene track is read as plain text (PREPARE_GFF3 greps and
  # sorts it, the reference preflight reads it with gawk), so a gzipped file cannot work. The form's
  # file browser then offers only .gff3 / .gff files, as it offers only .csv for `input`.
  # `exists`: a local path that is not there used to pass validation and abort the DAG build with the
  # unrelated "sample-sheet only contains tumor-samples" message (troubleshooting.md). nf-schema does
  # not check cloud paths (az://, s3://, gs://), so this covers local and https paths only.
  report_gff3:
    exists: true
    pattern: "^\\S+\\.gff3?$"
    errorMessage: "The gene annotation must be an uncompressed GFF3 file whose name ends in .gff3 or .gff."
    help_text: "Per-genome GFF3 providing the gene track shown in the igv-reports dashboards. An uncompressed file whose name ends in `.gff3` or `.gff`. Optional: if omitted, reports are still generated without the gene annotation track."
    allOf: *az_path_rule
  trim_fastq:
    description: "Deprecated alias of `trim_adapter` (upstream sarek name) - same behaviour, warns at startup."
    help_text: "Kept so upstream-shaped params files keep working. Use `--trim_adapter`."
  trim_nextseq:
    description: "Step 1 · Adapter trimming: force poly-G tail trimming (fastp `--trim_poly_g`); any non-zero value enables it. At 0 fastp decides from the read names, as in upstream sarek."
    help_text: "Poly-G tails come from two-colour chemistry (NextSeq/NovaSeq), where no signal reads as G. At 0 nothing is passed and fastp applies its own rule: poly-G trimming switches on automatically when the first read name carries a NextSeq/NovaSeq instrument prefix (e.g. `@A00123:...`) and stays off otherwise - so data renamed by SRA (`@SRR...`) is never poly-G-trimmed unless you set this. Any non-zero value forces it on for every dataset. The value itself is not passed to fastp (this is not Trim Galore's `--nextseq=X` quality cutoff); use `trim_quality_3prime` for quality trimming.\n\nfastp: non-zero = `--trim_poly_g` / `-g`; 0 = nothing passed (fastp's read-name auto-detection; `--disable_trim_poly_g` / `-G` is not exposed)."
  clip_r1:
    description: "Step 2 · Fixed-count clipping: remove this many bp from the 5' end of read 1 regardless of quality (fastp `--trim_front1`). For a known bad cycle; applied before step 3."
    help_text: "fastp: `--trim_front1` / `-f`."

  clip_r2:
    description: "Step 2 · Fixed-count clipping: remove this many bp from the 5' end of read 2 regardless of quality (fastp `--trim_front2`)."
    help_text: "fastp: `--trim_front2` / `-F`."

  three_prime_clip_r1:
    description: "Step 2 · Fixed-count clipping: remove this many bp from the 3' end of read 1 regardless of quality (fastp `--trim_tail1`); applied before step 3's quality cut."
    help_text: "fastp: `--trim_tail1` / `-t`."

  three_prime_clip_r2:
    description: "Step 2 · Fixed-count clipping: remove this many bp from the 3' end of read 2 regardless of quality (fastp `--trim_tail2`)."
    help_text: "fastp: `--trim_tail2` / `-T`."

  filter_quality:
    description: "Step 4 · Read filtering: discard read pairs with too many low-quality bases (fastp's read-level filter; thresholds below). Counted base by base against filter_quality_phred — the read's mean quality is never used; that is step 3's window. On by default whenever fastp runs, as in upstream sarek."
  length_required:
    description: "Step 4 · Read filtering: discard reads shorter than this after trimming (fastp `--length_required`)."
    help_text: "fastp's default is 15 bp. A pair is discarded when either mate is too short. Always applied when fastp runs, independent of `filter_quality`.\n\nfastp: `--length_required` / `-l`; the length filter itself can only be disabled by fastp's `-L`, which is not exposed."
  save_trimmed:
    description: "Outputs: publish the trimmed FASTQ files (preprocessing/fastp/<sample>/)."
  save_split_fastqs:
    description: "Outputs: publish the split FASTQ shards (split_fastq > 0). Intended for testing."
  umi_read_structure:
    description: "Step 0 · UMI consensus: UMI read structure (enables the fgbio consensus step before fastp). Not used for ALE libraries."
  group_by_umi_strategy:
    description: "Step 0 · UMI consensus: fgbio grouping strategy (Identity, Edit, Adjacency, Paired)."
  split_fastq:
    help_text: "Uses fastp to split FASTQ files by number of reads, parallelising alignment across the shards. Note that a non-zero value runs fastp even with every trimming step off, and fastp's read-level quality filter then still applies (as in upstream sarek) unless `--filter_quality false`; adapter trimming stays off and poly-G trimming follows fastp's read-name auto-detection (NextSeq/NovaSeq names), as in upstream. Although the minimum value is 250 reads, if you have fewer than 250 reads a single FASTQ shard will still be created. Every ALE profile sets 0.\n\nfastp: `--split_by_lines` / `-S` with 4 x this value."
  tools:
    description: "Comma-separated list of tools to run. Tier-1 ALE recipe: `snpeff,cnvkit,tiddit,manta,haplotypecaller`."
    help_text: "Multiple tools separated with commas. All calling is **germline** — every sample carries `status = 0` in the samplesheet (see `docs/usage/input_samplesheet.md`); sarek's tumor-only and paired somatic modes are unused.\n\n**Tier-1 (release-validated for ALE):**\n\n- SNVs/Indels: `haplotypecaller` — GATK HaplotypeCaller, joint cohort calling per `experiment` (`--joint_germline`)\n- Copy-number: `cnvkit`\n- Structural variants: `manta`, `tiddit` — cohort-merged via SVDB\n- Annotation: `snpeff` (custom cache)\n\nOther sarek callers (`mutect2`, `freebayes`, `controlfreec`, ...) remain runnable but are Tier-2: functional, not release-validated for ALE."
  joint_manta:
    default: true
    description: "One multi-sample Manta germline run per experiment, every sample of the experiment genotyped at each candidate SV."
    help_text: "Evidence-backed presence/absence in the cohort SV matrix: an event with weak evidence in one sample is reported as a genotype (with PR/SR read support and a per-sample FT) instead of being absent from that sample's VCF. Outputs publish under `variant_calling/manta/<experiment>/` and are split back to per-sample VCFs.\n\nJoint SV calling is a single task per experiment whose cost grows with each added sample; intended for small cohorts (validated at 4 samples). For large samplesheets leave this off — per-sample Manta feeds the same cohort SV merge, only without explicit `0/0` genotypes at other samples' candidates.\n\nNote: samplesheets with multiple experiments are untested in joint mode; planned development will move joint calling to all samples (matching joint HaplotypeCaller's cohort-wide behavior)."
  multiqc_title:
    description: "Prefix of the three MultiQC report titles (default 'yAMP': 'yAMP read-QC', 'yAMP alignment-QC', 'yAMP complete-QC')."
    help_text: "The pipeline writes three MultiQC reports to `multiqc/`: read-QC and alignment-QC while the run continues, complete-QC at the end. The early two take their file names from the title (`<prefix>-read-QC_multiqc_report.html`, `<prefix>-alignment-QC_multiqc_report.html`); the complete report always keeps the plain `multiqc_report.html` / `multiqc_data/`, which the mutation-report index links to."

# Keys DELETED from a parameter's entry (applied after property_overrides).
# snpeff_cache: upstream ships `default: s3://annotation-cache/snpeff_cache/`. That bucket holds no
# custom genome (six human/mouse/worm builds), and the Seqera launch form injects a SCHEMA default
# over profile values (docs/dev-practices/azure_batch_execution.md §13), which killed profile-only
# launches. nextflow.config sets `snpeff_cache = null` to match — nf-core lint compares the two.
# Passing the annotation-cache URL explicitly still works unchanged.
# custom_config_base: same pattern (2026-09-08). nextflow.config sets it `null` so no run pulls
# nf-core's institutional configs from GitHub at runtime; the schema still carried upstream's URL and
# the launch form injected it (§13, run 2eiGBEA0NXagap), so a Platform run `includeConfig`ed
# nfcore_custom.config + pipeline/sarek.config while a local run did not — a latent local-vs-Seqera
# difference. Setting the URL explicitly still works unchanged.
property_removals:
  snpeff_cache:
    - default
  custom_config_base:
    - default

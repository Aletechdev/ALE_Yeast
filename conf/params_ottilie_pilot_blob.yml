# Ottilie FULL-DEPTH PILOT — 4 samples, all 16 chromosomes, inputs on Azure Blob (az://).
#
# Purpose: the COLD-POOL DISK MEASUREMENT (RUNBOOK.md open items, specified 2026-08-12). It is a
# diagnostic run, NOT a contract test — the pilot set has no truth set. The release contract test
# is conf/params_ottilie_test_blob.yml (2 samples, 4 chromosomes, 4 SNVs + a chr I duplication).
#
# Use with:
#   tw launch ... --params-file conf/params_ottilie_pilot_blob.yml --config conf/disk_probe.config
#
# ⚠️ ATTACH conf/disk_probe.config, or the run measures nothing. It logs each node's `/`, work-dir
#    and `/mnt` usage at the start of every task. Sample the FIRST task on each node — that reading
#    is the base cost and is the whole point — not only the peak.
# ⚠️ The probe perturbs the task hash (`beforeScript` lives in .command.run), so this run cannot
#    reuse, or be reused by, a cached run. `-resume` is forfeited deliberately.
# ⚠️ Launch on a FRESHLY FORGED compute environment (deploy/azure/seqera-sp/13_create_compute_env.sh).
#    New pools guarantee cold nodes, which is stronger than waiting for an existing pool to drain.
#
# ⚠️ Why the tool list matches the contract test EXACTLY (see `tools` below): the image set must be
#    identical to the validated 170-task run, so the difference between the two disk readings is
#    attributable to data scale alone and not to a different set of containers.

# Inputs — the PILOT set. Note fastq_pilot_full/, not fastq_test/: 4 samples at full depth across
# all 16 chromosomes (~4.0 GB), versus the test set's 2 samples on chr I/IV/VII/XV (~356 MB).
# The two are NOT interchangeable — docs/benchmarking/ottilie_xenobiotic_ale/blob_layout.md.
input: "az://aletest/ottilie/v1/samplesheet_pilot_az.csv"

# ⚠️ DATE-STAMPED, and it must be bumped for every run. publishDir OVERWRITES files but never
# DELETES ones a later version stops producing, so reusing a directory silently accumulates stale
# outputs and makes any comparison untrustworthy. Treat the literal below as "the last run launched",
# never as "wherever the next run goes".
# ⚠️ Must be a FRESH directory, and the work dir must be fresh too — a shared outdir already produced
# one uncitable artifact here (seqera-runs/2026-08-07-01 mixes a Fusion and a non-Fusion run).
# ⚠️ Never point at az://aletest/ottilie-azurebatch-out/ (the verified local-head-job baseline) or at
# seqera-runs/2026-08-06-04 (the verified Platform baseline).
outdir: "az://aletest/seqera-runs/2026-08-12-01-pilot-diskprobe"

# Reference — the FULL genome. S288C_reference/, NOT the S288C_reference_test/ 4-chromosome subset.
genome: null
igenomes_ignore: true
fasta: "az://aletest/ottilie/v1/S288C_reference/S288C_R64.fa"
genbank: "az://aletest/ottilie/v1/S288C_reference/S288C_R64_ensembl_chrnames.gb"

# ⚠️ NO fasta_fai / dict / bwa here, deliberately. The validated cloud run does not pass them, so
# Sarek builds them in-run; the indices are not even staged to blob. Passing them would remove tasks
# from the graph and break comparability with the run this is measured against.

# chr_dir feeds Control-FREEC only, which is not in `tools` — prepare_genome short-circuits to an
# empty channel when it is unset. Kept anyway so the staging workload matches the contract test's.
chr_dir: "az://aletest/ottilie/v1/S288C_reference/chromosomes"

# Annotation — full-genome cache, same snpEff DB version as the contract test.
snpeff_db: "R64-1-1.105"
snpeff_cache: "az://aletest/ottilie/v1/S288C_reference/snpeff_cache"

# Tools — IDENTICAL to conf/params_ottilie_test_blob.yml. Do not add to this list for a disk run.
# ⚠️ No controlfreec, even though the LOCAL pilot script (run_ottilie_pilot.sh) uses it: it is
# Tier-2, and its ASSESS_SIGNIFICANCE step is auto-skipped at ploidy 1 — which every pilot sample
# is — so it would pull an extra image and add a failure-prone step for no measurement value.
tools: "snpeff,cnvkit,tiddit,manta,haplotypecaller"
skip_tools: "baserecalibrator"

# Joint germline calling — as the contract test.
joint_germline: true
split_haplotypecaller_joint_vcf: true
hard_filter_haplotypecaller_joint: true

# Mutation report — the igv-reports dashboard. ON, matching the contract test.
generate_reports: true

# Gene-annotation track for the igv-reports dashboards. Optional (reports build without it), and
# this is the one reference file the test set already shared — it was always the full-genome gff3.
report_gff3: "az://aletest/ottilie/v1/S288C_reference/S288C_R64.gff3"

# Performance
split_fastq: 0

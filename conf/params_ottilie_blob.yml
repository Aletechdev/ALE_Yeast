# Ottilie contract test — all inputs on Azure Blob (az://), for Azure Batch / Seqera runs.
# Use with:  nextflow run main.nf -profile docker -c conf/azure_batch.config -params-file conf/params_ottilie_blob.yml
input: "az://aletest/ottilie/v1/samplesheet_test_az.csv"

# Output directory — a SAFETY NET, not the value you should run with.
#
# Why it must be here at all: `tw launch` has no way to pass a single pipeline param — its only
# channels are --params-file, --config and --profile. `nextflow.config` defaults outdir to null,
# which publishes to a literal `null/` directory, so a Seqera launch without this lands nowhere
# useful. bin/test_ottilie_azure_batch.sh still overrides it with --outdir (CLI outranks
# -params-file), so this changes nothing for the local Azure Batch path.
#
# ⚠️ For a REAL run, copy this file and bump the date/counter below.
# publishDir OVERWRITES files but never DELETES ones a later version stops producing, so reusing
# one directory silently accumulates stale outputs from older pipeline versions and makes any
# comparison untrustworthy. (Seen for real: output_ottilie_test/ carried 5 files from a
# superseded version and corrupted the first cloud-vs-local diff.) The per-run copy doubles as
# provenance for exactly what was launched.
#
# The value is DATE-STAMPED (`<YYYY-MM-DD>-NN`) rather than a single stable path on purpose: a
# reusable default makes accidental reuse silent, whereas a dated one makes a forgotten bump
# obvious in the run's own output path. ⚠️ The flip side — this literal goes stale the day after
# it is written, so treat it as the last-launched run, never as "wherever the next run goes".
#
# ⚠️ Do NOT point a Seqera run at az://aletest/ottilie-azurebatch-out/ — those 445 blobs are the
# verified local-head-job baseline that cloud runs are compared against.
outdir: "az://aletest/seqera-runs/2026-08-06-01"

# Reference — 4-chromosome subset of S288C R64-1-1
genome: null
igenomes_ignore: true
fasta: "az://aletest/ottilie/v1/S288C_reference_test/S288C_R64_test.fa"
genbank: "az://aletest/ottilie/v1/S288C_reference_test/S288C_R64_test.gb"
chr_dir: "az://aletest/ottilie/v1/S288C_reference_test/chromosomes"

# Annotation — snpeff_cache is a DIRECTORY param; az:// staging verified working
snpeff_db: "R64-1-1.105"
snpeff_cache: "az://aletest/ottilie/v1/S288C_reference_test/snpeff_cache"

# Tools
tools: "snpeff,cnvkit,tiddit,manta,haplotypecaller"
skip_tools: "baserecalibrator"

# Joint germline calling
joint_germline: true
split_haplotypecaller_joint_vcf: true
hard_filter_haplotypecaller_joint: true

# Mutation report — the igv-reports dashboard. ON.
# Stated explicitly rather than inherited: it matches the nextflow.config default today,
# but this file should not silently change behaviour if that default ever moves.
generate_reports: true

# report_gff3 supplies the gene-annotation track for the igv-reports dashboards. It is
# OPTIONAL — without it the reports still build, just without the gene track — but the
# contract test wants the track, so set it here.
# Note the path: S288C_reference/, NOT the S288C_reference_test/ subset.
# (Until 2026-08-04 omitting this aborted the DAG and reported a bogus samplesheet error;
#  see docs/dev-practices/troubleshooting.md.)
report_gff3: "az://aletest/ottilie/v1/S288C_reference/S288C_R64.gff3"

# Performance
split_fastq: 0

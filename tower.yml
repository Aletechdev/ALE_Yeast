# Seqera Platform "Outputs" tab — which published files are listed there, and in what order.
#
# Replaces the nf-core/sarek 3.5.1 file (ASCAT / Control-FREEC / VEP / UMI entries never match an
# ALE run; per-sample mosdepth, bcftools-stats and snpEff txt tables multiply with sample count and
# are all rendered by MultiQC anyway). Only the entry points people actually open are listed.
#
# Ordering: the tab sorts entries by display name (observed on run 3BOrydQ9kJrgaH, 2026-09-14; the
# Platform docs do not specify a sort), so every label carries a number to fix the reading order:
# index first, then the all-sample tables (SNV/InDel → SV → CN), MultiQC, per-sample reports last.
# Labels follow the dashboard's own vocabulary ("all samples", not "cohort"); file names are unchanged.
#
# Limits (docs.seqera.io/platform-cloud/reports/overview): < 10 MB previews in the browser,
# 10–25 MB download-only, > 25 MB listed by path only. Per-sample HaplotypeCaller igv-reports on a
# full-depth run are 14–40 MB, so the tab is a quick look; the downloaded folder is the delivery
# route. The index's relative links DO resolve inside the tab's preview (verified 2026-09-11).
#
# The tab fills WHILE the run is going: the Tower plugin records each matching publish and syncs the
# list to the work dir about once a minute (measured 2026-09-29 on run 5CiOiON5oJuETn —
# deploy/azure/seqera-sp/RUNBOOK.md). So the two early MultiQC reports (6a, 6b) are readable mid-run;
# the complete one (6) comes last. A QC-only run (docs/usage/qc_first_run.md) publishes only 6a. The
# leading * keeps 6a/6b matching when multiqc_title replaces the 'yAMP' prefix; 6 keeps its default
# name whatever the title.
reports:
  "**/multiqc/*read-QC_multiqc_report.html":
    display: "6a. MultiQC read-QC — input checks, FastQC, fastp (while the run continues)"
  "**/multiqc/*alignment-QC_multiqc_report.html":
    display: "6b. MultiQC alignment-QC — + duplicates, mapping stats, coverage (while the run continues)"
  "**/mutation_reports/index.html":
    display: "1. Start here — mutation report index"
  "**/mutation_reports/cohort_report.html":
    display: "2. SNV & InDel report — all samples (HaplotypeCaller, IGV)"
  "**/mutation_reports/data/sv_cohort_matrix_union_pass.csv":
    display: "3. SV table — all samples (Manta + TIDDIT, PASS)"
  "**/mutation_reports/data/cn_cohort_collapsed.csv":
    display: "4. CN windows table — all samples (CNVKit, collapsed)"
  "**/mutation_reports/data/contig_copy_number.csv":
    display: "5. Contig copy-number table — all samples (TIDDIT, incl. Mito)"
  "**/multiqc/multiqc_report.html":
    display: "6. MultiQC complete-QC — all QC incl. variant stats and software versions"
  "**/mutation_reports/samples/*_report.html":
    display: "7. Per-sample IGV report"
